# Production-like local run: docker compose up --build  →  http://localhost:5050
services:
  mongo:
    image: mongo:8
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    ports:
      - "5050:5050"
    environment:
      MONGODB_URI: mongodb://mongo:27017/eve
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo-data:
